name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
    # The advisor memory service is exercised against a real database rather
    # than a mock, so its deduplication and expiry behaviour is tested as
    # Prisma actually executes it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finbrain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finbrain_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @finbrain/api exec prisma db push --skip-generate
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finbrain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finbrain_test
      # No CLERK_SECRET_KEY: the API's DEV_MODE bypass and the web app's
      # DevAuthProvider stand in for a hosted sign-in the suite cannot script.
      DEV_MODE: "true"
      VITE_CLERK_PUBLISHABLE_KEY: ""
      FRONTEND_URL: http://localhost:5173
      PORT: "4000"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @finbrain/api exec prisma db push --skip-generate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: [lint-typecheck, test, e2e]
    strategy:
      matrix:
        node-version: [20]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  docker:
    # Builds both images on every run, so a broken Dockerfile shows up on the
    # pull request. Pushes to Google Artifact Registry only from main and only
    # when the GCP_SA_KEY and GCP_PROJECT_ID secrets are set.
    runs-on: ubuntu-latest
    needs: [build]
    env:
      PUSH: ${{ github.ref == 'refs/heads/main' && secrets.GCP_SA_KEY != '' && secrets.GCP_PROJECT_ID != '' }}
      REGISTRY: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/finbrain
    steps:
      - uses: actions/checkout@v4
      - name: Push or build only
        run: |
          if [ "$PUSH" = true ]; then
            echo "Pushing to $REGISTRY"
          else
            echo "::notice::Building the images without pushing (pushing needs main and the GCP_SA_KEY and GCP_PROJECT_ID secrets)"
          fi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Google Artifact Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}
      - name: Build (and push) API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ env.PUSH == 'true' && format('{0}/api:latest', env.REGISTRY) || 'finbrain-api:ci' }}
      - name: Build (and push) Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ env.PUSH == 'true' && format('{0}/web:latest', env.REGISTRY) || 'finbrain-web:ci' }}

  release:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract version from CHANGELOG
        id: version
        run: |
          VERSION=$(grep -m1 '^## ' CHANGELOG.md | sed 's/## //' | sed 's/ — .*//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Extract release notes
        run: |
          awk '/^## /{if(c++) exit} /^### /{p=1} p{print}' CHANGELOG.md > /tmp/release-notes.md
      - name: Create Release
        run: |
          if gh release view "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.version }} already exists, skipping"
            exit 0
          fi
          gh release create "${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes-file /tmp/release-notes.md \
            --target "${{ github.sha }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
