version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finbrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-finbrain}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finbrain}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finbrain

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finbrain

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-finbrain}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-finbrain}
      REDIS_URL: redis://redis:6379
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID}
      PLAID_SECRET: ${PLAID_SECRET}
      PLAID_ENV: ${PLAID_ENV:-sandbox}
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    # /ready verifies the database; /health only says the process is alive, so
    # an instance with a dead connection pool used to keep receiving traffic.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/api/v1/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - finbrain

  # Scheduled dumps with retention. A maintained image rather than a cron
  # container of our own: it already handles the schedule, the daily/weekly/
  # monthly rotation and pruning, and pins the pg_dump client to the server
  # major version -- all of which is where a hand-rolled backup script goes
  # quietly wrong.
  #
  # Restores go through scripts/restore-db.sh; scripts/verify-backup.sh proves
  # the round trip still works. See docs/OPERATIONS.md.
  db-backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-finbrain}
      POSTGRES_USER: ${POSTGRES_USER:-finbrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      # Custom format, so a single table can be restored without replaying the
      # whole dump.
      POSTGRES_EXTRA_OPTS: "--format=custom --no-owner --no-privileges"
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-4}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}
    volumes:
      # Bound to the host, not a named volume: a backup that lives only inside
      # Docker dies with the Docker host, which is one of the failures it is
      # supposed to protect against. Copy this directory off the machine.
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - finbrain

  ml-service:
    build:
      context: .
      dockerfile: apps/ml-service/Dockerfile
    restart: unless-stopped
    ports:
      - "${ML_PORT:-8000}:8000"
    environment:
      PYTHONUNBUFFERED: 1
    volumes:
      - ./apps/ml-service/data:/app/data
    networks:
      - finbrain

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:80"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
      VITE_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
    depends_on:
      - api
    networks:
      - finbrain

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - web
      - api
    networks:
      - finbrain

volumes:
  pgdata:

networks:
  finbrain:
    driver: bridge
