services:
  postgres:
    image: postgres:16-alpine
    container_name: finbrain-postgres
    environment:
      POSTGRES_USER: finbrain
      POSTGRES_PASSWORD: finbrain
      POSTGRES_DB: finbrain
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finbrain"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: finbrain-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: finbrain-api
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://finbrain:finbrain@postgres:5432/finbrain
      REDIS_URL: redis://redis:6379
      PORT: "4000"
      FRONTEND_URL: http://localhost:5173
      DEV_MODE: "true"
    env_file:
      - apps/api/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages:/app/packages

  ml-service:
    build:
      context: apps/ml-service
      dockerfile: Dockerfile
    container_name: finbrain-ml
    ports:
      - "8000:8000"
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./apps/ml-service/src:/app/src
      - ./apps/ml-service/data:/app/data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: finbrain-web
    ports:
      - "5173:5173"
    env_file:
      - apps/web/.env
    depends_on:
      - api
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./packages:/app/packages

volumes:
  postgres_data:
  redis_data:
  ml_data:
